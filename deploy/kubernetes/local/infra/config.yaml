apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-config
data:
  PROBE_DATABASE_URL: postgresql+asyncpg://probe:probe@postgres:5432/probe
  PROBE_DIAGNOSTICS: "false"
  PROBE_ARTIFACT_STORAGE: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: probe-artifacts
  S3_ACCESS_KEY_ID: probe
  S3_SECRET_ACCESS_KEY: probe-development
  S3_PRESIGNED_URL_TTL: "3600"
  PROBE_TEMPORAL_ADDRESS: temporal:7233
  PROBE_TEMPORAL_NAMESPACE: probe
  PROBE_TEMPORAL_TASK_QUEUE: probe-runs
