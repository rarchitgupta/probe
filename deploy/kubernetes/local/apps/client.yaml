apiVersion: v1
kind: Service
metadata:
  name: probe-client
spec:
  selector:
    app: probe-client
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-client
  template:
    metadata:
      labels:
        app: probe-client
    spec:
      containers:
        - name: client
          image: probe-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
