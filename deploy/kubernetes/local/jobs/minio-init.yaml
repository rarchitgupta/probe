apiVersion: batch/v1
kind: Job
metadata:
  name: probe-minio-init
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-client
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          command:
            - /bin/sh
            - -c
            - mc alias set local http://minio:9000 probe probe-development && mc mb --ignore-existing local/probe-artifacts
