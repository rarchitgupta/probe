services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: probe
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe
    ports:
      - "${PROBE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - probe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d probe"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: probe
      MINIO_ROOT_PASSWORD: probe-development
    ports:
      - "${PROBE_MINIO_PORT:-9000}:9000"
      - "${PROBE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - probe-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 probe probe-development && mc mb --ignore-existing local/probe-artifacts"
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      PROBE_DATABASE_URL: ${PROBE_CONTAINER_DATABASE_URL:-postgresql+asyncpg://probe:probe@postgres:5432/probe}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    init: true
    ipc: host
    environment:
      PROBE_DATABASE_URL: ${PROBE_CONTAINER_DATABASE_URL:-postgresql+asyncpg://probe:probe@postgres:5432/probe}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
      PROBE_DIAGNOSTICS: ${PROBE_DIAGNOSTICS:-false}
      PROBE_ARTIFACT_STORAGE: ${PROBE_ARTIFACT_STORAGE:-s3}
      S3_ENDPOINT_URL: ${PROBE_CONTAINER_S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-probe-artifacts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-probe}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-probe-development}
      S3_PRESIGNED_URL_TTL: ${S3_PRESIGNED_URL_TTL:-3600}
    ports:
      - "${PROBE_API_PORT:-8000}:8000"
    volumes:
      - probe-artifacts:/app/.runs
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_PROBE_API_URL: ${NEXT_PUBLIC_PROBE_API_URL:-http://localhost:8000}
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "${PROBE_CLIENT_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  probe-postgres-data:
  probe-artifacts:
  probe-minio-data:
