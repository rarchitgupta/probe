[project]
name = "qa-agent"
version = "0.1.0"
description = "AI-powered browser QA agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62.0",
    "pydantic-ai-slim>=2.30.0",
]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
