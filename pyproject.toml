[project]
name = "probe"
version = "0.1.0"
description = "AI-powered browser QA agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langfuse>=4.14.4",
    "playwright>=1.62.0",
    "pydantic-ai-slim[openai]>=2.30.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
probe = "qa_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agent"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
