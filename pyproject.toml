[project]
name = "qa-agent"
version = "0.1.0"
description = "AI-powered browser QA agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62.0",
    "pydantic-ai-slim[openai]>=2.30.0",
]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
