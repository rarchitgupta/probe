[project]
name = "probe"
version = "0.1.0"
description = "AI-powered browser QA agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "langfuse>=4.14.4",
    "playwright>=1.62.0",
    "pydantic-ai-slim[openai]>=2.30.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.3",
]

[project.scripts]
probe = "qa_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/qa_agent", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
